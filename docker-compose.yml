version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sabycut-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sabycut_db}
      POSTGRES_USER: ${POSTGRES_USER:-sabycut_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sabycut_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sabycut_user} -d ${POSTGRES_DB:-sabycut_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sabycut-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sabycut-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend-core:
    build:
      context: ./backend-core
      dockerfile: Dockerfile
    container_name: sabycut-backend-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sabycut_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sabycut_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sabycut_secret}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SABYCUT_VAULT_MASTER_KEY: ${SABYCUT_VAULT_MASTER_KEY:-0123456789abcdef0123456789abcdef}
      SABYCUT_AI_SERVICE_URL: http://ai-service:5000
      SABYCUT_AI_SERVICE_TOKEN: ${SABYCUT_AI_SERVICE_TOKEN:-internal_secret_token_12345}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: sabycut-media
    ports:
      - "8080:8080"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: sabycut-ai-service
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      INTERNAL_API_TOKEN: ${SABYCUT_AI_SERVICE_TOKEN:-internal_secret_token_12345}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: sabycut-media
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sabycut-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend-core

volumes:
  postgres_data:
  redis_data:
  minio_data:
